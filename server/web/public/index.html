<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>Vigie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --paper: #EEF1F3; --surface: #F8FAFB; --field: #FFFFFF; --ink: #17212B; --muted: #5D6B78; --line: #D5DBE0;
  --ok: #2E7A58; --warn: #A5650F; --err: #B53A27; --run: #2D5FA8; --idle: #B9C2CA;
  --ok-bg: #E1EEE7; --warn-bg: #F5EAD8; --err-bg: #F6E1DC; --run-bg: #DFE8F5;
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151B21; --surface: #1C242C; --field: #111820; --ink: #E3E8EC; --muted: #93A1AD; --line: #2B3640;
    --ok: #52B489; --warn: #DDA044; --err: #EE7461; --run: #73A2EA; --idle: #3A4652;
    --ok-bg: #1D3329; --warn-bg: #362B18; --err-bg: #3A221D; --run-bg: #1E2C40;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 0.9375rem/1.5 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 68rem; margin: 0 auto; padding: 1.25rem clamp(1rem, 4vw, 2.5rem) 4rem; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* Header and navigation */
.top { display: flex; align-items: center; gap: 1.5rem; padding-bottom: 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: flex-end; gap: .5rem; font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; text-decoration: none; }
nav.main { display: flex; gap: .25rem; flex-wrap: wrap; }
nav.main a { text-decoration: none; padding: .3rem .65rem; border-radius: 6px; color: var(--muted); }
nav.main a:hover { color: var(--ink); background: var(--surface); }
nav.main a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 -2px 0 var(--ink); }
.top .right { margin-left: auto; display: flex; align-items: center; gap: .75rem; color: var(--muted); font-size: .85rem; }

/* Buttons and fields */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: .45rem .9rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: .4rem; line-height: 1.3; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--err); }
.btn.small { padding: .25rem .6rem; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-top: 1.25rem; }
form.stack, .stack { display: grid; gap: 1rem; max-width: 36rem; }
.field { display: grid; gap: .3rem; }
.field label { font-weight: 700; font-size: .9rem; }
.field label .opt { font-weight: 400; color: var(--muted); }
.field .help { color: var(--muted); font-size: .82rem; }
.field .tech { font-family: var(--mono); font-size: .75rem; color: var(--muted); font-weight: 400; margin-left: .35rem; }
input[type=text], input[type=password], input[type=number], select {
  width: 100%; padding: .5rem .65rem; border: 1px solid var(--line); border-radius: 6px; background: var(--field);
}
input:focus, select:focus { border-color: var(--run); outline: none; box-shadow: 0 0 0 3px var(--run-bg); }
input.code { font-family: var(--mono); font-size: 1.3rem; letter-spacing: .25em; max-width: 12rem; text-align: center; }
.msg { padding: .7rem .9rem; border-radius: 8px; margin: 0 0 1rem; max-width: 46rem; }
.msg.err { background: var(--err-bg); color: var(--err); }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.info { background: var(--run-bg); color: var(--run); }

/* Page titles */
.page-head { padding: 2rem 0 1.25rem; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem; }
.page-head h1 { margin: 0; font-size: clamp(1.6rem, 3.6vw, 2.3rem); line-height: 1.1; letter-spacing: -.02em; }
.page-head p { margin: .5rem 0 0; color: var(--muted); max-width: 60ch; }
.page-head .crumb { font-size: .85rem; color: var(--muted); margin-bottom: .5rem; }
.page-head .crumb a { color: var(--muted); }
h2.section { font-size: 1.1rem; margin: 2rem 0 .75rem; }

/* Wizard steps */
ol.steps { list-style: none; display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; padding: 0; margin: 0 0 1.75rem; font-size: .88rem; color: var(--muted); counter-reset: s; }
ol.steps li { counter-increment: s; display: flex; gap: .45rem; align-items: center; }
ol.steps li::before { content: counter(s); width: 1.45rem; height: 1.45rem; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); font-size: .78rem; }
ol.steps li.done::before { content: "✓"; background: var(--ok-bg); color: var(--ok); border-color: transparent; }
ol.steps li.current { color: var(--ink); font-weight: 700; }
ol.steps li.current::before { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Access screens */
.gate { max-width: 30rem; margin: 3rem auto 0; }
.gate h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.1; letter-spacing: -.02em; margin: 0 0 .5rem; }
.gate > p { color: var(--muted); margin: 0 0 1.5rem; }
.qr { background: #fff; padding: .75rem; border-radius: 8px; width: 13rem; border: 1px solid var(--line); }
.qr svg { display: block; width: 100%; height: auto; }
.secret { font-family: var(--mono); font-size: .95rem; letter-spacing: .08em; word-break: break-all; background: var(--surface); padding: .5rem .7rem; border-radius: 6px; border: 1px solid var(--line); }

/* Code blocks and fact lists */
pre.cmd, pre.log { margin: 0; padding: .9rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font: .8rem/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; overflow: auto; }
pre.log { max-height: 26rem; }
.cmd-wrap { position: relative; max-width: 52rem; }
.cmd-wrap .btn { position: absolute; top: .5rem; right: .5rem; }
.bigcode { font-family: var(--mono); font-size: 1.6rem; letter-spacing: .12em; font-weight: 700; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: .45rem 1.5rem; margin: 0; max-width: 52rem; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: .3rem; }
.chip { font-family: var(--mono); font-size: .78rem; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: .05rem .4rem; }
.waiting { display: flex; gap: .75rem; align-items: center; color: var(--run); font-weight: 500; }
.waiting::before { content: ""; width: .8rem; height: .8rem; border-radius: 50%; background: var(--run); animation: breathe 1.4s ease-in-out infinite; }

/* Status badges */
.badge { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 700; padding: .12rem .55rem .12rem .45rem; border-radius: 999px; white-space: nowrap; color: var(--c); background: var(--bg); }
.badge::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; }
.lv-ok   { --c: var(--ok);   --bg: var(--ok-bg); }
.lv-warn { --c: var(--warn); --bg: var(--warn-bg); }
.lv-err  { --c: var(--err);  --bg: var(--err-bg); }
.lv-run  { --c: var(--run);  --bg: var(--run-bg); }
.lv-idle { --c: var(--muted); --bg: var(--surface); }

/* Lists (servers, services, audit log) */
.rows { border-top: 1px solid var(--line); }
.rows > a, .rows > div.row { display: grid; gap: 1rem; align-items: center; padding: .85rem .5rem; border-bottom: 1px solid var(--line); text-decoration: none; }
.rows > a:hover { background: var(--surface); }
.rows.servers > * { grid-template-columns: 8rem minmax(10rem, 1fr) minmax(12rem, 1.3fr) 9rem; }
.rows.services > * { grid-template-columns: 8rem minmax(10rem, 1.4fr) 10rem 10rem; }
.rows.audit > * { grid-template-columns: 9.5rem 9rem 10rem 1fr; font-size: .88rem; }
.rows strong { display: block; }
.rows small, .muted { color: var(--muted); font-size: .82rem; }
.rows .badge { justify-self: start; }
.empty-note { color: var(--muted); padding: 1rem .5rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0; }
.tasks-pick { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); max-width: 60rem; }
.tasks-pick button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: .8rem .9rem; cursor: pointer; }
.tasks-pick button:hover { border-color: var(--ink); }
.tasks-pick strong { display: block; }
.tasks-pick small { color: var(--muted); font-family: var(--mono); font-size: .75rem; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem; }

/* Dashboard */
.verdict { padding: 2.25rem 0 2rem; border-bottom: 1px solid var(--line); }
.verdict h1 { margin: 0; font-size: clamp(1.9rem, 4.6vw, 3rem); line-height: 1.08; font-weight: 700; letter-spacing: -.025em; max-width: 22ch; }
.verdict .sub { margin: .75rem 0 0; color: var(--muted); max-width: 60ch; }
.attention { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid; gap: .5rem; max-width: 52rem; }
.attention li { display: grid; grid-template-columns: 8rem 1fr; gap: .75rem; align-items: baseline; }
.attention li > .badge { justify-self: start; }
.attention a { font-weight: 700; text-decoration: none; margin-right: .5rem; }
.attention a:hover { text-decoration: underline; }
.attention .why { color: var(--muted); }
.host { margin-top: 2.5rem; }
.host h2 { margin: 0 0 .5rem; font-size: 1.1rem; font-weight: 700; display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
.host h2 span { font-weight: 400; font-size: .85rem; color: var(--muted); }
.host .none { color: var(--muted); border-top: 1px solid var(--line); margin: 0; padding: .9rem .5rem; }
.task { border-top: 1px solid var(--line); }
.task:last-child { border-bottom: 1px solid var(--line); }
.task-head { width: 100%; display: grid; align-items: center; text-align: left; cursor: pointer; grid-template-columns: 8.5rem minmax(10rem, 1.1fr) minmax(12rem, 1.6fr) 11rem; gap: 1rem; padding: .9rem .5rem; background: none; border: 0; }
.task-head:hover { background: var(--surface); }
.task-head .badge { justify-self: start; }
.task.lv-err > .task-head { box-shadow: inset 3px 0 0 var(--err); }
.task.lv-warn > .task-head { box-shadow: inset 3px 0 0 var(--warn); }
.name strong { display: block; font-weight: 700; }
.name small, .when small { display: block; color: var(--muted); font-size: .82rem; }
.when small { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.progress { display: block; height: 4px; border-radius: 2px; background: var(--run-bg); margin: .35rem 0 .2rem; overflow: hidden; max-width: 18rem; }
.progress i { display: block; height: 100%; background: var(--run); border-radius: 2px; }
.strip { display: flex; align-items: flex-end; gap: 2px; height: 2rem; justify-content: flex-end; }
.strip i { flex: 0 0 5px; border-radius: 1.5px; background: var(--idle); min-height: 3px; }
.strip i.s-success { background: var(--ok); }
.strip i.s-warning { background: var(--warn); }
.strip i.s-error { background: var(--err); }
.strip i.s-running { background: var(--run); animation: breathe 1.6s ease-in-out infinite; }
.strip i.s-empty { background: transparent; box-shadow: inset 0 -3px 0 var(--line); }
@keyframes breathe { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .strip i.s-running, .waiting::before { animation: none; } }
.task-body { padding: .25rem .5rem 1.5rem; display: grid; grid-template-columns: minmax(15rem, 20rem) 1fr; gap: 1.5rem; }
.runs { list-style: none; margin: 0; padding: 0; max-height: 26rem; overflow: auto; }
.runs button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: .1rem .75rem; text-align: left; border: 0; background: none; padding: .45rem .6rem; border-radius: 6px; cursor: pointer; }
.runs button:hover { background: var(--surface); }
.runs button[aria-current="true"] { background: var(--surface); box-shadow: inset 2px 0 0 var(--c); }
.runs .d { font-size: .88rem; } .runs .t { color: var(--muted); font-size: .82rem; }
.runs .r { grid-column: 1 / -1; color: var(--c); font-size: .82rem; font-weight: 500; }
.detail { min-width: 0; }
.detail .meta { display: flex; flex-wrap: wrap; gap: .35rem 1.5rem; margin: 0 0 .75rem; font-size: .85rem; }
.detail .meta div { display: flex; gap: .4rem; } .detail dt { color: var(--muted); } .detail dd { margin: 0; font-weight: 500; }
.detail p.sum { margin: 0 0 .75rem; }
.detail .open-svc { font-size: .85rem; }

@media (max-width: 52rem) {
  .task-head, .rows.servers > *, .rows.services > *, .rows.audit > * { grid-template-columns: 1fr auto; gap: .35rem .75rem; }
  .task-head .badge, .rows .badge { grid-row: 1; grid-column: 2; justify-self: end; }
  .task-head .name { grid-row: 1; grid-column: 1; }
  .task-head .when, .task-head .strip, .rows > * > :nth-child(n+3) { grid-column: 1 / -1; }
  .task-head .strip { justify-content: flex-start; height: 1.5rem; }
  .task-body, .split { grid-template-columns: 1fr; }
  .attention li { grid-template-columns: 1fr; gap: .15rem; }
  .top .right { margin-left: 0; }
}

/* Checkbox and service ordering */
.check { display: flex; align-items: center; gap: .55rem; font-weight: 400; cursor: pointer; }
.check input { width: 1.1rem; height: 1.1rem; margin: 0; accent-color: var(--ink, #1b2430); }
.rows.reorder > div.row { grid-template-columns: 2.2rem minmax(10rem, 1.4fr) 10rem 5.5rem; }
.rows.reorder .pos { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.rows.reorder .moves { display: flex; gap: .3rem; justify-content: flex-end; }
.rows.reorder .moves .btn { padding: .2rem .55rem; min-width: 2.2rem; }
@media (max-width: 640px) { .rows.reorder > div.row { grid-template-columns: 2rem 1fr 5.5rem; } .rows.reorder .sched { display: none; } }
/* Logo */
.brand .logo { display: block; width: 28px; height: 28px; }
/* Language selector */
.lang { display: inline-flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .85rem; }
.lang select { width: auto; padding: .25rem 1.6rem .25rem .5rem; font-size: .85rem; border-radius: 6px; }
.top .brand-only { margin-right: auto; }
</style>
</head>

// ═══ Language ═══════════════════════════════════════════════════════════════
const LANGS = Object.keys(I18N);
function detectLang() {
  let saved = null;
  try { saved = localStorage.getItem('vigie.lang'); } catch (e) { /* storage unavailable */ }
  if (saved && I18N[saved]) return saved;
  for (const l of navigator.languages || [navigator.language || 'en']) {
    const code = String(l).slice(0, 2).toLowerCase();
    if (I18N[code]) return code;
  }
  return 'en';
}
let LANG = detectLang();

/** Translation with {placeholders}; any missing key falls back to English, then to the key itself. */
function t(key, params = {}) {
  let s = I18N[LANG][key] ?? I18N.en[key] ?? key;
  for (const [k, v] of Object.entries(params)) s = s.split(`{${k}}`).join(String(v));
  return s;
}
const has = key => key in I18N[LANG];
/** Plural forms: key_one / key_other. */
const tn = (key, n, params = {}) => t(`${key}_${n > 1 ? 'other' : 'one'}`, { n, ...params });
const locale = () => t('locale');

/** Descriptions and labels sent by the agent (in English), translated when possible. */
const taskLabel = (name, fallback) => has(`task.${name}`) ? t(`task.${name}`) : fallback;
const paramLabel = (task, p) => has(`param.${task}.${p.name}`) ? t(`param.${task}.${p.name}`)
  : has(`param.${p.name}`) ? t(`param.${p.name}`) : (p.label || p.name);

function setLang(l) {
  LANG = I18N[l] ? l : 'en';
  try { localStorage.setItem('vigie.lang', LANG); } catch (e) { /* storage unavailable */ }
  document.documentElement.lang = LANG;
  renderChrome();
  if (document.body.dataset.auth === 'ok') route(); else boot();
}

// ═══ Utilities ══════════════════════════════════════════════════════════════
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let clockSkew = 0;                                   // server / browser clock offset (s)
const nowS = () => Math.floor(Date.now() / 1000) + clockSkew;

/** Error message in the current language, from the code and parameters sent by the API.
 *  When a language has no translation for a code, the API's English text is shown. */
function apiErrorText(data, status) {
  if (!data || !data.code) return data?.error || t('err.http', { status });
  const p = { ...(data.params || {}) };
  if (data.code === 'login_locked' && p.until_ts) p.until = hm(p.until_ts);
  const sep = LANG === 'fr' ? ' : ' : ': ';
  let text = has(`err.${data.code}`) ? t(`err.${data.code}`, p) : (data.error || data.code);
  if (data.code === 'params_rejected' && Array.isArray(p.errors) && has('err.params_rejected')) {
    text = t('err.params_rejected') + sep + p.errors.map(e => has(`err.${e.code}`) ? t(`err.${e.code}`, e.params) : e.code).join(' ; ');
  }
  return [text, data.detail].filter(Boolean).join(sep);
}

class AuthNeeded extends Error {}
async function api(path, body) {
  const opt = body === undefined ? { cache: 'no-store' }
    : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vigie': '1' }, body: JSON.stringify(body) };
  const res = await fetch('api/' + path, opt);
  const data = await res.json().catch(() => null);
  if (data === null) throw new Error(t('err.bad_response', { status: res.status }));
  if (res.status === 401 && data.auth) { boot(); throw new AuthNeeded(); }
  if (!res.ok) throw new Error(apiErrorText(data, res.status));
  return data;
}

function dur(s) {
  if (s == null) return '';
  if (s < 60) return `${s} s`;
  if (s < 3600) return `${Math.round(s / 60)} min`;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (s < 86400) return m ? `${h} h ${String(m).padStart(2, '0')}` : `${h} h`;
  const d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600), u = t('unit.day');
  return hh ? `${d} ${u} ${hh} h` : `${d} ${u}`;
}
const hm = ts => new Date(ts * 1000).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
const day = ts => new Date(ts * 1000).toLocaleDateString(locale(), { weekday: 'short', day: 'numeric', month: 'short' });
function ago(ts) {
  if (!ts) return t('common.never');
  const n = nowS(), s = n - ts;
  if (s < 60) return t('time.just_now');
  if (s < 3600) return t('time.min_ago', { n: Math.round(s / 60) });
  const d = new Date(ts * 1000).toDateString();
  if (d === new Date(n * 1000).toDateString()) return t('time.today_at', { t: hm(ts) });
  if (d === new Date((n - 86400) * 1000).toDateString()) return t('time.yesterday_at', { t: hm(ts) });
  return t('time.date_at', { d: day(ts), t: hm(ts) });
}
/** Full date and time, shown on hover. */
const fullDate = ts => ts ? new Date(ts * 1000).toLocaleString(locale(), { dateStyle: 'full', timeStyle: 'medium' }) : '';
const intervalLabel = m => m < 60 ? `${m} min` : m < 1440 ? `${m / 60} h` : '24 h';
const every = m => t('interval.every', { i: intervalLabel(m) });

function msg(kind, text) { return `<p class="msg ${kind}" role="${kind === 'err' ? 'alert' : 'status'}">${esc(text)}</p>`; }
function showError(el, e) {
  if (e instanceof AuthNeeded) return;
  el.innerHTML = msg('err', e.message);
}
function reasonText(r) {
  if (!r) return '';
  if (r.code === 'summary') return r.params.text || '';
  const p = r.params || {};
  return t(`reason.${r.code}`, { d: dur(p.since ?? p.elapsed), limit: dur(p.limit) });
}
const delayText = d => d && d.code === 'fast' ? t('delay.fast') : t('delay.next_sync', { m: d?.minutes ?? '?' });

// Waiting loops (agent, requests) stop as soon as the page changes
let viewToken = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(token, fn, test, everyMs = 2500, maxMs = 45 * 60 * 1000) {
  const end = Date.now() + maxMs;
  while (token === viewToken && Date.now() < end) {
    const r = await fn();
    if (test(r)) return r;
    await sleep(everyMs);
  }
  return null;
}

function copyButton(text) {
  return `<button type="button" class="btn small" data-copy="${esc(text)}">${t('common.copy')}</button>`;
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (!c) return;
  navigator.clipboard?.writeText(c.dataset.copy).then(() => { c.textContent = t('common.copied'); setTimeout(() => c.textContent = t('common.copy'), 1500); });
});

// ═══ Page chrome: navigation and language selector ══════════════════════════
function renderChrome() {
  document.documentElement.lang = LANG;
  document.querySelector('nav.main').setAttribute('aria-label', t('nav.main'));
  document.querySelectorAll('[data-nav]').forEach(a => { a.textContent = t(`nav.${a.dataset.nav}`); });
  const sel = document.getElementById('lang');
  sel.innerHTML = LANGS.map(l => `<option value="${l}" ${l === LANG ? 'selected' : ''}>${esc(I18N[l]['lang.name'])}</option>`).join('');
  sel.setAttribute('aria-label', t('lang.label'));
}
document.getElementById('lang').addEventListener('change', e => setLang(e.target.value));

function setAuthenticated(ok) {
  document.body.dataset.auth = ok ? 'ok' : 'no';
  document.querySelector('nav.main').hidden = !ok;
  document.getElementById('stamp').hidden = !ok;
}

// ═══ Start-up and access ════════════════════════════════════════════════════
async function boot() {
  viewToken++;
  setAuthenticated(false);
  try {
    const res = await fetch('api/auth/status', { cache: 'no-store' });
    const st = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(apiErrorText(st, res.status));
    if (st.state === 'setup') return renderSetup(st);
    if (st.state === 'login') return renderLogin();
    setAuthenticated(true);
    route();
  } catch (e) {
    $app.innerHTML = `<section class="gate"><h1>${t('boot.down_title')}</h1>
      ${msg('err', e.message)}
      <p class="muted">${t('boot.down_hint')}</p>
      <div class="actions"><button class="btn" id="retry">${t('common.retry')}</button></div></section>`;
    document.getElementById('retry').onclick = boot;
  }
}

function renderSetupTotp(r) {
  let qr = '';
  try { const q = qrcode(0, 'M'); q.addData(r.uri); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) { /* manual entry */ }
  $app.innerHTML = `<section class="gate">
    <ol class="steps"><li class="done">${t('setup.step_password')}</li><li class="current">${t('setup.step_mfa')}</li></ol>
    <h1>${t('mfa.title')}</h1>

      <div class="field"><label>${t('mfa.manual')}</label>
        <div class="secret">${esc(r.secret.replace(/(.{4})/g, '$1 ').trim())}</div>
        <span class="help">${t('mfa.manual_help')}</span></div>
      <form class="stack" id="f-totp">
        <div class="field"><label for="t-code">${t('mfa.code')}</label>

    </div></section>`;
  document.getElementById('t-code').focus();

    ev.preventDefault();

}

  document.getElementById('f-login').addEventListener('submit', async ev => {
    ev.preventDefault();
    const box = document.getElementById('l-msg');
    try {
      await api('auth/login', { password: document.getElementById('l-pw').value, totp: document.getElementById('l-code').value,
        remember: document.getElementById('l-remember').checked });
      boot();
    } catch (e) { showError(box, e); document.getElementById('l-code').value = ''; }
  });
}

// ═══ Routing ════════════════════════════════════════════════════════════════
function route() {
  viewToken++;
  clearInterval(dashTimer);
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean);
  const nav = parts[0] === 'servers' || parts[0] === 'services' ? 'servers'
    : parts[0] === 'audit' ? 'audit' : parts[0] === 'settings' ? 'settings' : 'dashboard';
  document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  window.scrollTo(0, 0);
  if (parts[0] === 'servers' && parts[1] === 'new') return viewServerNew();
  if (parts[0] === 'servers' && parts[1] && parts[2] === 'service') return viewServiceNew(+parts[1]);
  if (parts[0] === 'servers' && parts[1]) return viewServer(+parts[1]);
  if (parts[0] === 'servers') return viewServers();
  if (parts[0] === 'services' && parts[1]) return viewService(+parts[1]);
  if (parts[0] === 'audit') return viewAudit();
  if (parts[0] === 'settings') return viewSettings();
  if (parts[0] && parts[0].startsWith('t-')) dashOpenAnchor = parts[0];
  return viewDashboard();
}
window.addEventListener('hashchange', () => { if (document.body.dataset.auth === 'ok') route(); });
// A link to the page already shown triggers no "hashchange": reload the view instead
// (e.g. "Add another service" at the end of the service wizard).
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (a.getAttribute('href') === location.hash && document.body.dataset.auth === 'ok') {
    e.preventDefault();
    route();
  }
});

// ═══ Dashboard ══════════════════════════════════════════════════════════════
const HEALTH_LEVEL = { ok: 'ok', running: 'run', warning: 'warn', overrun: 'warn', unknown: 'warn', late: 'err', lost: 'err', error: 'err' };
const RUN_LEVEL = { success: 'ok', warning: 'warn', error: 'err', running: 'run' };
const dashOpen = new Set(), dashSelected = new Map();
let dashState = null, dashTimer = null, dashOpenAnchor = null;

async function viewDashboard() {
  const token = viewToken;
  if (!dashState) $app.innerHTML = `<p class="muted" style="padding:2rem 0">${t('common.loading')}</p>`;
  const load = async () => {
    try {
      dashState = await api('state');
      clockSkew = dashState.now - Math.floor(Date.now() / 1000);
      if (token !== viewToken) return;
      if (dashOpenAnchor) {
        const tk = dashState.hosts.flatMap(h => h.tasks).find(x => x.anchor === dashOpenAnchor);
        if (tk) dashOpen.add(String(tk.id));
      }
      renderDashboard();
      document.getElementById('stamp').textContent = t('common.refreshed', { time: hm(dashState.now) });
      if (dashOpenAnchor) { document.getElementById(dashOpenAnchor)?.scrollIntoView({ block: 'start' }); dashOpenAnchor = null; }
    } catch (e) { if (token === viewToken) showError($app, e); }
  };
  await load();
  dashTimer = setInterval(() => { if (!document.hidden && token === viewToken) load(); }, 30000);
}

function strip(tk) {
  const hist = tk.history.slice(-24);
  const lengths = hist.map(r => r.status === 'running' ? dashState.now - r.started_at : (r.duration ?? 0));
  const max = Math.max(1, ...lengths);
  const bars = hist.map((r, i) => {
    const h = 15 + 85 * Math.log1p(lengths[i]) / Math.log1p(max);
    return `<i class="s-${r.status}" style="height:${h.toFixed(0)}%" title="${esc(`${day(r.started_at)} ${hm(r.started_at)}, ${t(`run.${r.status}`)}, ${dur(lengths[i])}`)}"></i>`;
  });
  return `<span class="strip" aria-hidden="true">${Array(Math.max(0, 24 - hist.length)).fill('<i class="s-empty"></i>').join('')}${bars.join('')}</span>`;
}

function whenCell(tk) {
  const last = tk.last;
  if (!last) return `<span class="when">${t('dash.no_run')}<small>${t('dash.no_run_hint')}</small></span>`;
  if (last.status === 'running') {
    const el = dashState.now - last.started_at;
    const bar = tk.typical ? `<span class="progress"><i style="width:${Math.min(100, 100 * el / tk.typical).toFixed(0)}%"></i></span>` : '';
    const note = tk.reason ? reasonText(tk.reason) : (tk.previous ? t('dash.previous', { s: tk.previous.summary || t(`run.${tk.previous.status}`) }) : '');
    const usual = tk.typical ? t('dash.usually', { d: dur(tk.typical) }) : t('dash.first_tracked');
    return `<span class="when">${esc(t('dash.running_for', { d: dur(el), usual }))}${bar}<small>${esc(note)}</small></span>`;
  }
  return `<span class="when" title="${esc(fullDate(last.finished_at ?? last.started_at))}">${esc(t('dash.when', { ago: ago(last.finished_at ?? last.started_at), d: dur(last.duration) }))}<small>${esc(tk.reason ? reasonText(tk.reason) : (last.summary ?? ''))}</small></span>`;
}

function taskRow(tk) {
  const lv = HEALTH_LEVEL[tk.health];
  const k = String(tk.id), isOpen = dashOpen.has(k);
  return `<article class="task lv-${lv}" id="${esc(tk.anchor)}" data-key="${k}">
    <button class="task-head" type="button" aria-expanded="${isOpen}">
      <span class="badge lv-${lv}">${t(`health.${tk.health}`)}</span>
      <span class="name"><strong>${esc(tk.descr)}</strong><small>${esc(tk.task)}${tk.schedule ? `, ${esc(tk.schedule)}` : ''}</small></span>
      ${whenCell(tk)}${strip(tk)}
    </button>
    <div class="task-body" ${isOpen ? '' : 'hidden'}>${isOpen ? taskBody(tk) : ''}</div>
  </article>`;
}

function taskBody(tk) {
  const runs = [...tk.history].reverse();
  const cur = dashSelected.get(String(tk.id)) ?? runs[0]?.id;
  const items = runs.map(r => {
    const length = r.status === 'running' ? dashState.now - r.started_at : r.duration;
    return `<li><button type="button" class="lv-${RUN_LEVEL[r.status]}" data-run="${r.id}" aria-current="${r.id === cur}">
      <span class="d">${esc(t('time.date_at', { d: day(r.started_at), t: hm(r.started_at) }))}</span><span class="t">${dur(length)}</span><span class="r">${t(`run.${r.status}`)}</span></button></li>`;
  }).join('');
  return `<ul class="runs">${items || `<li class="muted">${t('dash.no_runs')}</li>`}</ul>
    <div class="detail" data-detail="${cur ?? ''}">${cur ? `<p class="sum">${t('dash.loading_log')}</p>` : ''}
    <p class="open-svc"><a href="#/services/${tk.id}">${t('dash.service_config')}</a></p></div>`;
}

async function loadRunDetail(article) {
  const box = article.querySelector('.detail');
  const id = box?.dataset.detail;
  if (!id) return;
  try {
    const r = await api(`state?run=${encodeURIComponent(id)}`);
    const metrics = Object.entries(r.metrics || {}).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
    const code = r.exit_code != null ? `<div><dt>${t('dash.exit_code')}</dt><dd>${r.exit_code}</dd></div>` : '';
    box.innerHTML = `${r.summary ? `<p class="sum">${esc(r.summary)}</p>` : ''}
      ${metrics || code ? `<dl class="meta">${code}${metrics}</dl>` : ''}
      <pre class="log">${esc(r.log_tail || t('dash.empty_log'))}</pre>
      <p class="open-svc"><a href="#/services/${r.service_id}">${t('dash.service_config')}</a></p>`;
    const pre = box.querySelector('pre'); pre.scrollTop = pre.scrollHeight;
  } catch (e) { showError(box, e); }
}

function agentLine(a) {
  const pace = a.fast ? t('dash.pace_fast') : t('dash.pace', { i: intervalLabel(a.interval) });
  return esc(t('dash.agent_line', { ago: ago(a.last_seen), pace }))
    + (a.state === 'silent' ? ` <b class="badge lv-err">${t('dash.agent_silent')}</b>` : '');
}

function renderDashboard() {
  const s = dashState;
  if (!s.hosts.length) {
    $app.innerHTML = `<section class="verdict"><h1>${t('dash.empty_title')}</h1>
      <p class="sub">${t('dash.empty_sub')}</p>
      <div class="actions"><a class="btn primary" href="#/servers/new">${t('dash.add_server')}</a></div></section>`;
    return;
  }
  const all = s.hosts.flatMap(h => h.tasks);
  const silent = s.hosts.filter(h => h.agent.state === 'silent');
  const errs = all.filter(x => HEALTH_LEVEL[x.health] === 'err'), warns = all.filter(x => HEALTH_LEVEL[x.health] === 'warn');
  const running = all.filter(x => x.health === 'running');
  const issues = errs.length + warns.length + silent.length;
  const agentItems = silent.map(h => `<li><span class="badge lv-err">${t('dash.agent_silent')}</span><span><a href="#/servers/${h.agent.id}">${esc(h.host)}</a>
      <span class="why">${esc(h.agent.last_seen ? t('dash.last_sync', { ago: ago(h.agent.last_seen) }) : t('dash.never_synced'))}</span></span></li>`).join('');
  const list = agentItems + [...errs, ...warns, ...running].map(x => {
    const lv = HEALTH_LEVEL[x.health];
    const why = x.reason ? reasonText(x.reason) : (x.health === 'running' ? t('dash.since', { d: dur(s.now - x.last.started_at) }) : '');
    return `<li><span class="badge lv-${lv}">${t(`health.${x.health}`)}</span><span><a href="#/${esc(x.anchor)}" data-jump="${x.id}">${esc(x.descr)}</a>
      <span class="why">${esc(t('dash.on_host', { host: x.host }))}${why ? ` : ${esc(why)}` : ''}</span></span></li>`;
  }).join('');
  const services = tn('dash.services', all.length), servers = tn('dash.servers', s.hosts.length);
  $app.innerHTML = `<section class="verdict">
      <h1>${issues === 0 ? t('dash.all_good') : esc(tn('dash.issues', issues))}</h1>
      <p class="sub">${esc(running.length ? t('dash.sub_running', { services, servers, n: running.length }) : t('dash.sub', { services, servers }))}</p>
      ${list ? `<ul class="attention">${list}</ul>` : ''}</section>
    ${s.hosts.map(h => `<section class="host" id="h-${h.agent.id}">
      <h2><a href="#/servers/${h.agent.id}" style="text-decoration:none">${esc(h.host)}</a> <span>${esc(tn('dash.host_services', h.tasks.length))}, ${agentLine(h.agent)}</span></h2>
      ${h.tasks.length ? h.tasks.map(taskRow).join('') : `<p class="none">${t('dash.no_service')} <a href="#/servers/${h.agent.id}/service">${t('dash.add_service')}</a></p>`}
    </section>`).join('')}`;
  document.querySelectorAll('.task').forEach(a => { if (dashOpen.has(a.dataset.key)) loadRunDetail(a); });
}

$app.addEventListener('click', e => {
  if (!dashState || !document.querySelector('.verdict')) return;
  const jump = e.target.closest('[data-jump]');
  if (jump) { dashOpen.add(jump.dataset.jump); return; }
  const head = e.target.closest('.task-head');
  if (head) {
    const k = head.closest('.task').dataset.key;
    dashOpen.has(k) ? dashOpen.delete(k) : dashOpen.add(k);
    renderDashboard();
    document.querySelector(`[data-key="${CSS.escape(k)}"] .task-head`)?.focus();
    return;
  }
  const run = e.target.closest('[data-run]');
  if (run) {
    const art = run.closest('.task');
    dashSelected.set(art.dataset.key, Number(run.dataset.run));
    art.querySelectorAll('[data-run]').forEach(b => b.setAttribute('aria-current', b === run));
    art.querySelector('.detail').dataset.detail = run.dataset.run;
    loadRunDetail(art);
  }
});

// ═══ Servers ════════════════════════════════════════════════════════════════
const AGENT_LEVEL = { ok: 'ok', silent: 'err', pending: 'idle' };

async function viewServers() {
  $app.innerHTML = `<div class="page-head"><h1>${t('servers.title')}</h1><p>${t('servers.intro')}</p></div><div id="list"></div>`;
  try {
    const rows = await api('admin/servers');

const serverSteps = current => `<ol class="steps">${['wiz.step_info', 'wiz.step_install', 'wiz.step_test']
  .map((k, i) => `<li class="${i < current ? 'done' : i === current ? 'current' : ''}">${t(k)}</li>`).join('')}</ol>`;
const INTERVALS = [1, 2, 3, 5, 10, 15, 20, 30, 60, 120, 180, 240, 360, 720, 1440];

// Wizard: server information → install the agent → agent connection test
function viewServerNew() {
  $app.innerHTML = `<div class="page-head"><div class="crumb"><a href="#/servers">${t('servers.title')}</a></div><h1>${t('wiz.server_title')}</h1></div>
    ${serverSteps(0)}
    <form class="stack" id="f-srv">

/** Steps 2 and 3: install command, then wait for the agent's first contact. */
async function enrollPanel(serverId, codeInfo) {
  const token = viewToken;
  const srv = await api(`admin/servers/${serverId}`).catch(e => { showError($app, e); return null; });
  if (!srv) return;
  clockSkew = srv.now - Math.floor(Date.now() / 1000);
  const issuedAt = nowS();
  const url = srv.public_url || 'http://<vigie-address>';
  const commands = `# ${t('enroll.cmd_where', { server: srv.name })}
cat > vigie.conf <<EOF
STATE_DIR="$(pwd)/state"          # ${t('enroll.cmd_state')}
SECRETS_FILE="/root/.env"         # ${t('enroll.cmd_secrets')}
EOF
chmod 700 vigie
./vigie enroll ${url} ${codeInfo.code}`;
  $app.innerHTML = `<div class="page-head"><div class="crumb"><a href="#/servers">${t('servers.title')}</a></div><h1>${esc(srv.name)}</h1></div>
    ${serverSteps(1)}
    <div class="stack" style="max-width:52rem">
      <div class="field"><label>${t('enroll.code')}</label>
        <div class="bigcode">${esc(codeInfo.code)}</div>
        <span class="help" id="e-exp"></span></div>
      <div class="field"><label>${t('enroll.on_server')}</label>
        <div class="cmd-wrap"><pre class="cmd">${esc(commands)}</pre>${copyButton(commands)}</div>
        ${srv.public_url ? '' : `<span class="help">${t('enroll.no_public_url')}</span>`}</div>
      <div id="e-state"><p class="waiting">${t('enroll.waiting')}</p></div>
    </div>`;
  const expEl = document.getElementById('e-exp');
  const tick = setInterval(() => {
    if (token !== viewToken) return clearInterval(tick);
    const left = codeInfo.expires - nowS();
    expEl.textContent = left > 0 ? t('enroll.valid_for', { d: dur(left) }) : t('enroll.expired_short');
  }, 1000);

  const enrolled = r => r && r.enrolled_at && r.enrolled_at >= issuedAt - 5;
  const done = await waitFor(token, () => api(`admin/servers/${serverId}`).catch(() => null),
    r => enrolled(r) || nowS() > codeInfo.expires, 3000);
  clearInterval(tick);
  if (token !== viewToken || !done) return;
  const box = document.getElementById('e-state');
  if (!enrolled(done)) {
    box.innerHTML = `${msg('err', t('enroll.expired'))}
      <div class="actions"><button class="btn primary" id="e-retry">${t('enroll.retry')}</button><a class="btn" href="#/servers/${serverId}">${t('common.finish')}</a></div>`;
    document.getElementById('e-retry').onclick = async () => { viewToken++; enrollPanel(serverId, await api(`admin/servers/${serverId}/enroll`, {})); };
    return;
  }
  document.querySelector('ol.steps').outerHTML = serverSteps(3);
  const f = done.facts || {};
  box.innerHTML = `${msg('ok', t('enroll.connected', { server: done.name }))}
    <dl class="facts">
      <dt>${t('facts.system')}</dt><dd>${esc(f.os || '?')} <span class="muted">${esc(f.kernel || '')}</span></dd>
      <dt>${t('facts.tasks')}</dt><dd><div class="chips">${done.catalog.map(x => `<span class="chip">${esc(x.name)}</span>`).join('')}</div></dd>
      <dt>${t('facts.containers')}</dt><dd><div class="chips">${(f.containers || []).map(c => `<span class="chip">${esc(c)}</span>`).join('') || `<span class="muted">${t('common.none')}</span>`}</div></dd>
    </dl>
    <div class="actions"><a class="btn primary" href="#/servers/${serverId}/service">${t('dash.add_service')}</a><a class="btn" href="#/servers/${serverId}">${t('common.finish')}</a></div>`;
}

const chips = arr => `<div class="chips">${(arr || []).map(m => `<span class="chip">${esc(m)}</span>`).join('') || '—'}</div>`;

async function viewServer(id) {
  const token = viewToken;

  try { s = await api(`admin/servers/${id}`); } catch (e) { return showError($app, e); }

  $app.innerHTML = `<div class="page-head"><div class="crumb"><a href="#/servers">${t('servers.title')}</a></div>
      <h1>${esc(s.name)} <span class="badge lv-${agentState[1]}" style="vertical-align:middle">${t(`agent.${agentState[0]}`)}</span></h1>
      <p>${esc(s.descr || '')}</p></div>
    <div id="s-msg"></div>
    ${f.user && f.user !== 'root' ? msg('err', t('server.not_root', { user: f.user })) : ''}
    ${s.sync_errors.length ? `<div class="msg err"><strong>${t('server.rejected')}</strong><br>${s.sync_errors.map(esc).join('<br>')}</div>` : ''}
    <h2 class="section">${t('server.services')}</h2>
    <div id="svc-list">${svcRows ? `<div class="rows services">${svcRows}</div>` : `<p class="empty-note">${t('server.no_services')}</p>`}
    <div class="actions">${s.enrolled_at && !s.revoked ? `<a class="btn primary" href="#/servers/${id}/service">${t('dash.add_service')}</a>` : ''}
      ${s.services.length > 1 ? `<button class="btn" type="button" id="a-order">${t('order.edit')}</button>` : ''}</div></div>

    <h2 class="section">${t('server.agent')}</h2>
    <div class="split">
      <dl class="facts">
        <dt>${t('facts.system')}</dt><dd>${esc(f.os || '—')} <span class="muted">${esc(f.kernel || '')}</span></dd>
        <dt>${t('facts.version')}</dt><dd>${esc(s.agent_version || '—')}</dd>
        ${f.boot_time ? `<dt>${t('facts.boot')}</dt><dd title="${esc(fullDate(f.boot_time))}">${esc(ago(f.boot_time))}</dd>` : ''}

/** Sort key of a cron expression: hour, then minute. Hourly jobs first, unscheduled services last. */
function cronKey(expr) {
  if (!expr) return [99, 99];
  const [m, h] = expr.split(' ');
  const first = f => { const n = parseInt(String(f).replace(/^\*\/?/, ''), 10); return Number.isNaN(n) ? 0 : n; };
  return [h.startsWith('*') ? -1 : first(h), first(m)];
}

/** Service ordering: arrows, "sort by time", then a single save. */
function reorderPanel(s, token, out) {
  let order = [...s.services];
  const box = document.getElementById('svc-list');
  const oldAgent = s.agent_version && s.agent_version.localeCompare('2.3', undefined, { numeric: true }) < 0;
  const render = () => {
    box.innerHTML = `<p class="muted">${t('order.intro')}</p>
      ${oldAgent ? msg('info', t('order.agent_old', { v: s.agent_version })) : ''}
      <div class="rows reorder">${order.map((v, i) => `<div class="row">
        <span class="pos">${i + 1}</span>
        <span><strong>${esc(v.name)}</strong><small>${esc(v.task)}</small></span>
        <span class="muted sched"><code>${v.schedule ? esc(v.schedule) : t('server.not_scheduled')}</code></span>
        <span class="moves">
          <button class="btn small" type="button" data-move="${i}" data-dir="-1" aria-label="${esc(t('order.up') + ' : ' + v.name)}" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="btn small" type="button" data-move="${i}" data-dir="1" aria-label="${esc(t('order.down') + ' : ' + v.name)}" ${i === order.length - 1 ? 'disabled' : ''}>↓</button>
        </span></div>`).join('')}</div>

        <button class="btn primary" type="button" id="o-save">${t('order.save')}</button>

    box.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {
      const i = +b.dataset.move, j = i + +b.dataset.dir;
      [order[i], order[j]] = [order[j], order[i]];
      render();
      box.querySelector(`[data-move="${j}"][data-dir="${b.dataset.dir}"]`)?.focus()
        || box.querySelector(`[data-move="${j}"]:not([disabled])`)?.focus();

    };
  };
  render();
}

// ═══ Services: parameter form generated from the task declaration ═══════════
function paramField(task, p, value, srv) {
  const id = `p-${p.name}`;
  const req = p.required && !p.default;
  const ph = p.default ? t('param.default', { v: p.default }) : '';
  let input;
  if (p.type === 'bool') {
    const v = value || p.default || 'no';
    input = `<select id="${id}" name="${p.name}"><option value="no" ${v === 'no' ? 'selected' : ''}>${t('param.no')}</option><option value="yes" ${v === 'yes' ? 'selected' : ''}>${t('param.yes')}</option></select>`;
  } else if (p.type === 'service') {
    input = `<select id="${id}" name="${p.name}"><option value="">${t('param.none')}</option>${srv.services.map(x => `<option value="${x.id}" ${String(x.id) === String(value) ? 'selected' : ''}>${esc(x.name)} (${esc(x.task)})</option>`).join('')}</select>`;
  } else {
    // *_ENV variables live in the container, not in the secrets file: no secret names to suggest
    const list = p.type === 'varname' ? (p.name.endsWith('_ENV') ? '' : 'dl-secrets') : (p.type === 'path' || p.type === 'paths') ? 'dl-mounts'
      : (p.type === 'name' && /CONTAINER/.test(p.name)) ? 'dl-containers' : '';
    input = `<input type="${p.type === 'int' ? 'number' : 'text'}" id="${id}" name="${p.name}" value="${esc(value ?? '')}" placeholder="${esc(ph)}"
      ${req ? 'required' : ''} ${list ? `list="${list}"` : ''} ${p.type === 'int' ? 'min="0"' : 'spellcheck="false"'} autocomplete="off">`;
  }
  const helpKey = [`param.help.${task}.${p.name}`, `param.help.${p.name}`].find(k => has(k) || k in I18N.en);
  const help = helpKey ? t(helpKey) : ['path', 'paths', 'varname', 'names'].includes(p.type) ? t(`param.help_${p.type}`) : '';
  return `<div class="field"><label for="${id}">${esc(paramLabel(task, p))} ${req ? '' : `<span class="opt">${t('common.optional')}</span>`}<span class="tech">${esc(p.name)}</span></label>
    ${input}${help ? `<span class="help">${help}</span>` : ''}</div>`;
}
function datalists(srv) {
  const f = srv.facts || {};
  const dl = (id, arr) => `<datalist id="${id}">${(arr || []).map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
  return dl('dl-secrets', f.secret_names) + dl('dl-mounts', f.mounts) + dl('dl-containers', f.containers);
}
function readParams(form) {
  const out = {};
  form.querySelectorAll('[name]').forEach(el => { if (/^[A-Z_][A-Z0-9_]*$/.test(el.name)) out[el.name] = el.value.trim(); });
  return out;
}

/** Sends a request (check or run) and shows its result. true / false / null (abandoned). */
async function runJob(token, serviceId, kind, box) {
  let job;
  try { job = await api(`admin/services/${serviceId}/${kind === 'check' ? 'test' : 'run'}`, {}); }
  catch (e) { showError(box, e); return false; }
  box.innerHTML = `<p class="waiting">${esc(t('svc.sent', { when: delayText(job.delay) }))}</p>`
    + (job.delay?.code === 'next_sync' ? `<p class="muted">${t('svc.sync_hint')}</p>` : '');
  const r = await waitFor(token, () => api(`admin/jobs/${job.id}`).catch(() => null),
    j => j && (j.state === 'done' || j.state === 'expired'), 2500, 7 * 3600 * 1000);
  if (token !== viewToken || !r) return null;
  const ok = r.state === 'done' && +r.result_ok === 1;
  const label = r.state === 'expired' ? t('svc.no_answer')
    : kind === 'check' ? t(ok ? 'svc.check_ok' : 'svc.check_failed') : t(ok ? 'svc.run_ok' : 'svc.run_failed');
  box.innerHTML = msg(ok ? 'ok' : 'err', label) + (r.output ? `<pre class="log">${esc(r.output)}</pre>` : '');
  return ok;
}

// Scheduling: common forms, or a free cron expression
function scheduleForm(current) {

      <select id="c-kind">${['daily', 'weekly', 'monthly', 'hourly', 'custom'].map(k => `<option value="${k}">${t(`cron.${k}`)}</option>`).join('')}</select></div>
    <div class="field" data-for="weekly"><label for="c-dow">${t('cron.day')}</label><select id="c-dow">${days.map((d, i) => `<option value="${i}" ${i === 6 ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select></div>
    <div class="field" data-for="monthly"><label for="c-dom">${t('cron.dom')}</label><input type="number" id="c-dom" min="1" max="28" value="1"></div>
    <div class="field" data-for="daily weekly monthly"><label for="c-time">${t('cron.time')}</label><input type="text" id="c-time" value="02:00" pattern="[0-2]?[0-9]:[0-5][0-9]" style="max-width:8rem"></div>
    <div class="field" data-for="hourly"><label for="c-min">${t('cron.minute')}</label><input type="number" id="c-min" min="0" max="59" value="0" style="max-width:8rem"></div>
    <div class="field" data-for="custom"><label for="c-expr">${t('cron.expr')}</label><input type="text" id="c-expr" value="${esc(current || '0 2 * * *')}" spellcheck="false">
      <span class="help">${t('cron.expr_help')}</span></div>
    <p class="muted">${t('cron.preview')} <code id="c-preview"></code></p>`;
}
function currentCron() {
  const kind = document.getElementById('c-kind').value;
  const [h, m] = (document.getElementById('c-time').value.match(/^(\d{1,2}):(\d{2})$/) || [0, '2', '0']).slice(1).map(Number);
  return { daily: `${m} ${h} * * *`, weekly: `${m} ${h} * * ${document.getElementById('c-dow').value}`,
    monthly: `${m} ${h} ${document.getElementById('c-dom').value} * *`, hourly: `${document.getElementById('c-min').value} * * * *`,
    custom: document.getElementById('c-expr').value.trim().replace(/\s+/g, ' ') }[kind];
}
function bindScheduleForm(current) {
  const kind = document.getElementById('c-kind');
  if (current) kind.value = 'custom';
  const refresh = () => {
    document.querySelectorAll('[data-for]').forEach(el => el.hidden = !el.dataset.for.split(' ').includes(kind.value));

  };
  document.querySelectorAll('#c-kind, #c-dow, #c-dom, #c-time, #c-min, #c-expr').forEach(el => el.addEventListener('input', refresh));
  refresh();
}

    const age = document.getElementById('p-age').value, run = document.getElementById('p-run').value;
    try {
      await api(`admin/services/${id}`, { name: document.getElementById('p-name').value, params: readParams(ev.target),
        max_age: age === '' ? null : +age, max_runtime: run === '' ? null : +run });
      out.innerHTML = msg('ok', t('detail.saved'));
    } catch (e) { showError(out, e); }
    window.scrollTo(0, 0);
  });
  document.getElementById('v-del').onclick = async () => {
    if (!confirm(t('detail.confirm_delete', { name: s.name }))) return;
    try { await api(`admin/services/${id}/delete`, {}); location.hash = `#/servers/${s.server_id}`; } catch (e) { showError(out, e); }
  };
  $app.querySelectorAll('[data-job]').forEach(a => a.onclick = async ev => {
    ev.preventDefault();
    try {
      const j = await api(`admin/jobs/${a.dataset.job}`);
      jobBox.innerHTML = `<h2 class="section">${t('detail.job_title', { n: j.id })}</h2>` + (j.output ? `<pre class="log">${esc(j.output)}</pre>` : msg('info', t('detail.no_output')));
      jobBox.scrollIntoView({ block: 'start', behavior: 'smooth' });
    } catch (e) { showError(jobBox, e); }
  });
}

// ═══ Audit log and settings ═════════════════════════════════════════════════
async function viewAudit() {
  $app.innerHTML = `<div class="page-head"><h1>${t('audit.title')}</h1><p>${t('audit.intro')}</p></div><div id="list"></div>`;
  try {
    const rows = await api('admin/audit?limit=200');
    document.getElementById('list').innerHTML = `<div class="rows audit">${rows.map(a => `<div class="row">
      <span class="muted">${esc(day(+a.at))} ${hm(+a.at)}</span><span>${esc(a.actor)}</span><span><code>${esc(a.action)}</code></span><span class="muted">${esc(a.detail || '')}</span></div>`).join('')}</div>`;
  } catch (e) { showError(document.getElementById('list'), e); }
}

function viewSettings() {
  $app.innerHTML = `<div class="page-head"><h1>${t('settings.title')}</h1></div>
    <h2 class="section">${t('settings.password')}</h2>
    <form class="stack" id="f-pw">
      <input type="text" name="username" value="admin" autocomplete="username" hidden>
      <div class="field"><label for="c-cur">${t('settings.current')}</label><input type="password" id="c-cur" required autocomplete="current-password"></div>
      <div class="field"><label for="c-new">${t('settings.new')}</label><input type="password" id="c-new" required minlength="12" autocomplete="new-password"></div>
      <div class="field"><label for="c-new2">${t('settings.confirm')}</label><input type="password" id="c-new2" required minlength="12" autocomplete="new-password"></div>
      <div class="field"><label for="c-code">${t('settings.code')}</label><input class="code" type="text" id="c-code" inputmode="numeric" maxlength="7" required autocomplete="one-time-code"></div>
      <div id="c-msg"></div>
      <div class="actions"><button class="btn primary" type="submit">${t('settings.submit')}</button></div>
    </form>
    <h2 class="section">${t('settings.session')}</h2>
    <p class="muted" style="max-width:60ch">${t('settings.session_text')}</p>
    <div class="actions"><button class="btn" id="c-logout">${t('settings.logout')}</button></div>`;
  document.getElementById('f-pw').addEventListener('submit', async ev => {
    ev.preventDefault();
    const box = document.getElementById('c-msg');
    if (document.getElementById('c-new').value !== document.getElementById('c-new2').value) { box.innerHTML = msg('err', t('setup.mismatch')); return; }
    try {
      await api('auth/password', { current: document.getElementById('c-cur').value, totp: document.getElementById('c-code').value, password: document.getElementById('c-new').value });
      ev.target.reset(); box.innerHTML = msg('ok', t('settings.changed'));
    } catch (e) { showError(box, e); }
  });
  document.getElementById('c-logout').onclick = async () => { await api('auth/logout', {}).catch(() => {}); dashState = null; location.hash = '#/'; boot(); };
}

// A view that fails must say so instead of staying on "Loading…"
window.addEventListener('unhandledrejection', ev => {
  if (ev.reason instanceof AuthNeeded) return;
  console.error(ev.reason);
  $app.insertAdjacentHTML('afterbegin', msg('err', ev.reason?.message && !(ev.reason instanceof TypeError)
    ? ev.reason.message : t('err.unexpected', { msg: String(ev.reason?.message ?? ev.reason) })));
});

renderChrome();
boot();
</script>
</body>
</html>
