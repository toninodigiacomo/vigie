# Web tier: static files and relay to the API. No code runs here.
ServerTokens Prod
ServerSignature Off
ProxyRequests Off

ProxyPass        /api/ http://8213-vigie-api/api/ timeout=60
ProxyPassReverse /api/ http://8213-vigie-api/api/

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'"
